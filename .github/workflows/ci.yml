# Intégration continue : à chaque push et à chaque pull request, GitHub vérifie que le projet
# passe le lint, le typage, les tests et le build de production. Résultat visible dans l'onglet "Actions".
name: CI

on:
  push:
  pull_request:
    branches: [dev, preprod, prod]

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Base PostgreSQL et Redis jetables, créées pour la durée de la vérification
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: album
          POSTGRES_PASSWORD: album
          POSTGRES_DB: album_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U album -d album_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgresql://album:album@localhost:5432/album_test
      REDIS_URL: redis://localhost:6379
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typage
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build de production
        run: npm run build
