# Environnement de production : l'application est construite à partir du Dockerfile,
# sans montage du code source. Les variables viennent du fichier .env du serveur.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Derrière un reverse proxy (HTTPS), le port 3000 n'est pas exposé publiquement.

services:
  app:
    build: .
    env_file: .env
    # Dans Docker, la base et Redis s'appellent "db" et "redis" (et non localhost comme en dev).
    # Le mot de passe doit rester sans caractères spéciaux d'URL (@, :, /, #).
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    # Accessible seulement depuis le serveur lui-même : le reverse proxy HTTPS (deploy/Caddyfile) est la seule entrée publique
    ports:
      - "127.0.0.1:3000:3000"
    # Pochettes optimisées gardées entre deux redémarrages (sinon tout est retéléchargé)
    volumes:
      - image_cache:/app/.next/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  image_cache:
