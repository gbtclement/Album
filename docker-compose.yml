services:
  app:
    # Le code est copié dans l'image puis synchronisé par `docker compose watch`.
    # Monter le dossier Windows provoquait des rechargements en boucle (faux changements vus par Turbopack).
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file: .env
    ports:
      - "3000:3000"
    develop:
      watch:
        # Chaque fichier modifié sur Windows est recopié dans le conteneur, Next.js recharge à chaud
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
        # Une nouvelle dépendance demande de reconstruire l'image (npm ci)
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        # La configuration Next.js n'est lue qu'au démarrage du serveur
        - action: sync+restart
          path: next.config.ts
          target: /app/next.config.ts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:
